name: CI Flask Todo App

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install flask
          fi

      - name: Validate Python syntax and code
        run: |
          python -m compileall -q .

      - name: Initialize SQLite database
        env:
          FLASK_APP: app.py
        run: |
          python -c "
          try:
              import app as app_module
              flask_app = getattr(app_module, 'app', None)
              if flask_app is not None:
                  with flask_app.app_context():
                      db = getattr(app_module, 'db', None)
                      if db is not None and hasattr(db, 'create_all'):
                          db.create_all()
          except Exception as e:
              print('DB init note:', e)
          "

      - name: Smoke test Flask server
        env:
          FLASK_APP: app.py
          FLASK_ENV: development
        run: |
          nohup flask run --host=127.0.0.1 --port=5000 > flask.log 2>&1 &
          SERVER_PID=$!
          sleep 3

          curl -fsS http://127.0.0.1:5000/ > /dev/null
          echo "Flask server responded with HTTP 200 OK"
          cat flask.log

          kill $SERVER_PID || true